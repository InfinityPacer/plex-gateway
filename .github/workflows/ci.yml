name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release version
        id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must use X.Y.Z format" >&2
            exit 1
          fi
          if [ "${REF_TYPE}" = "tag" ] && [ "${REF_NAME}" != "v${version}" ]; then
            echo "Git tag ${REF_NAME} does not match VERSION v${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Select immutable release source
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git fetch --force origin "refs/tags/v${VERSION}:refs/tags/v${VERSION}"
          git checkout --detach "v${VERSION}"
          if [ "$(tr -d '[:space:]' < VERSION)" != "${VERSION}" ]; then
            echo "Tag v${VERSION} does not contain VERSION ${VERSION}" >&2
            exit 1
          fi

      - name: Validate changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! grep -Eq "^## \[${VERSION}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md has no dated ${VERSION} release section" >&2
            exit 1
          fi
          if ! grep -Eq "^## \[${VERSION}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.en.md; then
            echo "CHANGELOG.en.md has no dated ${VERSION} release section" >&2
            exit 1
          fi

      - name: Run tests
        run: go test -count=1 ./...

      - name: Run race tests
        run: go test -race -count=1 ./...

      - name: Run vet
        run: go vet ./...

      - name: Build container
        run: docker build --tag plex-gateway:test .

      - name: Verify container version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          actual="$(docker run --rm plex-gateway:test version)"
          if [ "${actual}" != "${VERSION}" ]; then
            echo "container version ${actual} does not match ${VERSION}" >&2
            exit 1
          fi

  publish:
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: plex-gateway-image
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', needs.verify.outputs.version) || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/infinitypacer/plex-gateway:${{ needs.verify.outputs.version }}
            ghcr.io/infinitypacer/plex-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract release notes
        if: github.ref_type == 'tag'
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v version="${VERSION}" '
            index($0, "## [" version "] - ") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]:/) { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md release section is empty" >&2
            exit 1
          fi

      - name: Create or update GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "plex-gateway ${VERSION}" --notes-file release-notes.md
          else
            gh release create "${TAG}" --verify-tag --title "plex-gateway ${VERSION}" --notes-file release-notes.md
          fi

      - name: Summarize publication
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          {
            echo "Version: ${VERSION}"
            echo "Image: ghcr.io/infinitypacer/plex-gateway:${VERSION}"
            echo "Latest: ghcr.io/infinitypacer/plex-gateway:latest"
            echo "Digest: ${IMAGE_DIGEST}"
          } >> "${GITHUB_STEP_SUMMARY}"
