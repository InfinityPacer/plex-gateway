# Plex and MediaVault must also join this external network. For exclusive mode,
# Plex uses bridge networking and does not publish its own host port 32400.
services:
  plex-gateway:
    image: ghcr.io/infinitypacer/plex-gateway:latest
    restart: unless-stopped
    ports:
      - "32400:32400"
    env_file:
      - ./app.env
    volumes:
      - ./strm:/strm:ro
      - ./archive-strm:/archive-strm:ro
      # The image runs as UID/GID 1000; this directory must be writable by it.
      - ./app_data:/app_data
    networks:
      - media

networks:
  media:
    external: true
    name: media
